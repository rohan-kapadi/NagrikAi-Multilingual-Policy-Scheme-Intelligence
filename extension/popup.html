<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #047857;
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title h1 { font-size: 13px; font-weight: 700; color: #0f172a; }
    .title p { font-size: 10px; color: #64748b; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .profile-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .profile-card h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px dashed #f1f5f9;
    }
    .field-row:last-child { border-bottom: none; }
    .field-label { color: #64748b; }
    .field-value { font-weight: 600; color: #0f172a; text-transform: capitalize; }

    .btn-autofill {
      width: 100%;
      background: #047857;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-autofill:hover { background: #065f46; }

    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 9px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">न</div>
    <div class="title">
      <h1>Nagrik Copilot</h1>
      <p>1-Click Government Form Autofill</p>
    </div>
  </div>

  <div class="status-badge">
    <span>🔒 SHA-256 Vault Verified</span>
  </div>

  <div class="profile-card">
    <h3>Synced Citizen Profile</h3>
    <div class="field-row">
      <span class="field-label">Citizen Name:</span>
      <span class="field-value" id="val-name">Rohan Kapadi</span>
    </div>
    <div class="field-row">
      <span class="field-label">Occupation:</span>
      <span class="field-value" id="val-occupation">Farmer</span>
    </div>
    <div class="field-row">
      <span class="field-label">District / State:</span>
      <span class="field-value" id="val-location">Pune, MH</span>
    </div>
    <div class="field-row">
      <span class="field-label">Land Area:</span>
      <span class="field-value" id="val-land">1.2 Hectares</span>
    </div>
    <div class="field-row">
      <span class="field-label">Annual Income:</span>
      <span class="field-value" id="val-income">₹1,80,000</span>
    </div>
    <div class="field-row">
      <span class="field-label">Category:</span>
      <span class="field-value" id="val-category">General</span>
    </div>
  </div>

  <button class="btn-autofill" id="autofillBtn">
    <span>⚡ Auto-Fill Application Form</span>
  </button>

  <div class="footer">
    Zero-Knowledge • Human review before final submission
  </div>

  <script src="popup.js"></script>
</body>
</html>
